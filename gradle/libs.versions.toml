[versions]
appcompatVersion = "1.7.0"
assertjCoreVersion = "3.23.1"
atomicfuVersion = "0.27.0"
espressoCoreVersion = "3.6.1"
gradleVersion = "8.7.3"
junit = "1.2.1"
junitJupiterVersion = "5.10.1"
junitVersion = "4.13.2"
kermitVersion = "2.0.5"
kmpByteBufferVersion = "1.4.2"
coroutinesVersion = "1.10.1"
kotlinCryptoVersion = "0.4.0"
kotlinVersion = "2.1.10"
kotlinxDatetimeVersion = "0.6.2"
kotlinxSerializationJsonVersion = "1.8.0"
ktorVersion = "3.1.1"
okhttpVersion = "4.12.0"
secp256k1KmpVersion = "0.17.1"
uuidVersion = "0.8.4"
vanniktechPublishPlugin = "0.30.0"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertjCoreVersion" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfuVersion" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradleVersion" }
whyoleg-cryptography-provider-apple = { module = "dev.whyoleg.cryptography:cryptography-provider-apple", version.ref = "kotlinCryptoVersion" }
whyoleg-cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "kotlinCryptoVersion" }
whyoleg-cryptography-provider-openssl3-prebuilt = { module = "dev.whyoleg.cryptography:cryptography-provider-openssl3-prebuilt", version.ref = "kotlinCryptoVersion" }
whyoleg-cryptography-random = { module = "dev.whyoleg.cryptography:cryptography-random", version.ref = "kotlinCryptoVersion" }
whyoleg-cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "kotlinCryptoVersion" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCoreVersion" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "junit" }
junit = { module = "junit:junit", version.ref = "junitVersion" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiterVersion" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiterVersion" }
